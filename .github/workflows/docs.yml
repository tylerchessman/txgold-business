name: Docs

# Builds the docs site (docs/, VitePress) and deploys it to the TxGoldBusinessDocs Static Web App,
# which serves docs.txgold.money. Pull requests build only.
# Secret: AZURE_STATIC_WEB_APPS_API_TOKEN_DOCS, the Static Web App's deployment token.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'openapi/**', 'vectors/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'openapi/**', 'vectors/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-docs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DOCS }}
          action: upload
          app_location: dist
          skip_app_build: true
